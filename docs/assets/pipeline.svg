<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How a NorthStar run works</title>
  <desc id="desc">A task is planned, written in its own worktree, checked by plain code for slop and by your gates, then reviewed in a fresh read-only run. A failure sends the exact reason back to the writer for up to three tries. A pass is committed on a branch.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/><stop offset="0.6" stop-color="#0d1533"/><stop offset="1" stop-color="#171c44"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fb0ff"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9d8a"/></marker>
  </defs>
  <rect width="880" height="356" rx="20" fill="url(#sky)"/>
  <text x="28" y="46" font-size="12" font-weight="700" letter-spacing="2" fill="#ffd479">ONE RUN, START TO FINISH</text>
  <text x="28" y="68" font-size="13" fill="#9fb0d9">Nothing reaches your branch until every step says yes.</text>
  <rect x="16" y="92" width="104" height="54" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#5b6b9a" stroke-width="1.5"/><text x="68.0" y="124.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Task</text><text x="68.0" y="168" text-anchor="middle" font-size="11" fill="#9fb0d9">what you</text><text x="68.0" y="183" text-anchor="middle" font-size="11" fill="#9fb0d9">asked for</text><path d="M123,119.0 h12" stroke="#8fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="140" y="92" width="104" height="54" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7dd3fc" stroke-width="1.5"/><text x="192.0" y="124.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Plan</text><text x="192.0" y="168" text-anchor="middle" font-size="11" fill="#9fb0d9">reads the repo,</text><text x="192.0" y="183" text-anchor="middle" font-size="11" fill="#9fb0d9">sets the steps</text><path d="M247,119.0 h12" stroke="#8fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="264" y="92" width="104" height="54" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7dd3fc" stroke-width="1.5"/><text x="316.0" y="124.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Write</text><text x="316.0" y="168" text-anchor="middle" font-size="11" fill="#9fb0d9">in its own</text><text x="316.0" y="183" text-anchor="middle" font-size="11" fill="#9fb0d9">worktree</text><path d="M371,119.0 h12" stroke="#8fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="388" y="92" width="104" height="54" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffd479" stroke-width="1.5"/><text x="440.0" y="124.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Slop checks</text><text x="440.0" y="168" text-anchor="middle" font-size="11" fill="#9fb0d9">copies, escapes,</text><text x="440.0" y="183" text-anchor="middle" font-size="11" fill="#9fb0d9">AI credits</text><path d="M495,119.0 h12" stroke="#8fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="512" y="92" width="104" height="54" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffd479" stroke-width="1.5"/><text x="564.0" y="124.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Gates</text><text x="564.0" y="168" text-anchor="middle" font-size="11" fill="#9fb0d9">your tests,</text><text x="564.0" y="183" text-anchor="middle" font-size="11" fill="#9fb0d9">types and lint</text><path d="M619,119.0 h12" stroke="#8fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="636" y="92" width="104" height="54" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7dd3fc" stroke-width="1.5"/><text x="688.0" y="124.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Review</text><text x="688.0" y="168" text-anchor="middle" font-size="11" fill="#9fb0d9">a fresh run,</text><text x="688.0" y="183" text-anchor="middle" font-size="11" fill="#9fb0d9">read-only, skeptical</text><path d="M743,119.0 h12" stroke="#8fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="760" y="92" width="104" height="54" rx="12" fill="#ffd479" fill-opacity="1" stroke="#ffd479" stroke-width="1.5"/><text x="812.0" y="124.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1530">Commit</text><text x="812.0" y="168" text-anchor="middle" font-size="11" fill="#9fb0d9">on a branch,</text><text x="812.0" y="183" text-anchor="middle" font-size="11" fill="#9fb0d9">yours to merge</text>
  <path d="M440.0,192 V232" stroke="#ff9d8a" stroke-width="1.5" stroke-dasharray="3 4"/><path d="M564.0,192 V232" stroke="#ff9d8a" stroke-width="1.5" stroke-dasharray="3 4"/><path d="M688.0,192 V232" stroke="#ff9d8a" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M688.0,232 H326.0 Q316.0,232 316.0,222 V194" fill="none" stroke="#ff9d8a" stroke-width="1.5" marker-end="url(#back)"/>
  <rect x="350.0" y="246" width="494" height="50" rx="12" fill="#ff9d8a" fill-opacity="0.08" stroke="#ff9d8a" stroke-opacity="0.5"/>
  <text x="368.0" y="267" font-size="12.5" font-weight="700" fill="#ffc2b5">Not good enough? It goes back with the exact file, line and reason.</text>
  <text x="368.0" y="285" font-size="12" fill="#9fb0d9">Three tries at most. After that a human decides and nothing is committed.</text>
  <g font-size="12" fill="#dbe7ff">
    <circle cx="34" cy="322" r="5" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <text x="48" y="326">A model does this step</text>
    <circle cx="214" cy="322" r="5" fill="none" stroke="#ffd479" stroke-width="2"/>
    <text x="228" y="326">Plain code does this step. Same verdict every time, whoever wrote the change.</text>
  </g>
</svg>
