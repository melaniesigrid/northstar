: </tspan><tspan fill="#7ee2a8" font-weight="700">0 duplicated lines</tspan><tspan fill="#e6edff" font-weight="400">, 0 new suppressions, 0 AI credit notes.</tspan></text><text x="30" y="431" xml:space="preserve"><tspan fill="#e6edff" font-weight="400">- Gates: </tspan><tspan fill="#7ee2a8" font-weight="700">typecheck passed, test passed</tspan></text>
